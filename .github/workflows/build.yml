name: Build SDCleaner APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version, e.g. 1.1; blank increments the latest stable version."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP: SDCleaner

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Resolve version and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ github.event.inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          public_last=$(bash .github/scripts/latest-public-version.sh sdcleaner)
          local_last=$(git tag -l 'sdcleaner-v[0-9]*' | sed -nE 's/^sdcleaner-v([0-9]+\.[0-9])$/\1/p' | sort -V | tail -1 || true)
          latest=$(printf '%s\n%s\n' "$local_last" "$public_last" | sed '/^$/d' | sort -V | tail -1)
          if [[ -n "$REQUESTED" ]]; then
            [[ "$REQUESTED" =~ ^[0-9]+\.[0-9]$ ]] || { echo "::error::Version must look like 1.0"; exit 1; }
            version="$REQUESTED"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            version="${latest:-1.0}"
          elif [[ -z "$latest" ]]; then
            version="1.0"
          else
            number=$(( ${latest%.*} * 10 + ${latest#*.} + 1 ))
            version="$((number / 10)).$((number % 10))"
          fi
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && -n "$latest" ]]; then
            [[ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)" == "$version" && "$version" != "$latest" ]] || { echo "::error::Stable version must advance past $latest"; exit 1; }
          fi
          code=$((100000 + GITHUB_RUN_NUMBER))
          suffix=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then suffix="-experimental.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VERSION_SUFFIX=$suffix" >> "$GITHUB_ENV"
          {
            echo "## SDCleaner $version$suffix"
            echo
            echo "### Changes"
            git log -20 --no-merges --pretty='- %s'
            echo
            echo "### Install"
            echo "Install the signed APK from the update release."
          } > release-notes.md
      - name: Build debug APK for PR validation
        if: github.event_name == 'pull_request'
        env:
          N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testFossDebugUnitTest lintFossDebug assembleFossDebug -PappVersion="$VERSION" -PappVersionCode="$VERSION_CODE" -PappVersionSuffix="$VERSION_SUFFIX"
      - name: Prepare signing key
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
          SIGNING_KEYSTORE_ENC_BASE64: ${{ secrets.SIGNING_KEYSTORE_ENC_BASE64 }}
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_ALIAS: ${{ secrets.ANDROID_SIGNING_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/sdcleaner-signing"
          umask 077
          mkdir -p "$K"
          echo "$K" >> "$GITHUB_ENV"
          if [[ -n "$SIGNING_KEYSTORE_ENC_BASE64" ]]; then
            : "${SIGNING_PASSPHRASE:?SIGNING_PASSPHRASE required}"
            printf '%s' "$SIGNING_KEYSTORE_ENC_BASE64" | base64 --decode | openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:SIGNING_PASSPHRASE -out "$K/release.keystore"
          elif [[ -n "$ANDROID_SIGNING_KEYSTORE_B64" ]]; then
            printf '%s' "$ANDROID_SIGNING_KEYSTORE_B64" | base64 --decode > "$K/release.keystore"
          else
            echo "::error::Configure SIGNING_KEYSTORE_ENC_BASE64 or ANDROID_SIGNING_KEYSTORE_B64 for release signing"
            exit 1
          fi
          test -s "$K/release.keystore"
          {
            echo "STORE_PATH=$K/release.keystore"
            echo "STORE_PASSWORD=${ANDROID_SIGNING_STORE_PASSWORD:?ANDROID_SIGNING_STORE_PASSWORD required}" 
            echo "KEY_PASSWORD=${ANDROID_SIGNING_KEY_PASSWORD:-$ANDROID_SIGNING_STORE_PASSWORD}"
            echo "KEY_ALIAS=${ANDROID_SIGNING_ALIAS:?ANDROID_SIGNING_ALIAS required}"
          } >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
        run: |
          ./gradlew --no-daemon assembleFossRelease -PappVersion="$VERSION" -PappVersionCode="$VERSION_CODE" -PappVersionSuffix="$VERSION_SUFFIX"
          APK=$(find app/build/outputs/apk/foss/release -name '*.apk' -type f | head -1)
          test -n "$APK"
          cp "$APK" "$APP-$VERSION.apk"
          test -s "$APP-$VERSION.apk"
      - name: Verify release signer
        run: |
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APP-$VERSION.apk" | grep -E 'Signer.*(DN|SHA-256 digest)'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-${{ env.VERSION }}-${{ github.event_name == 'pull_request' && 'experimental' || 'stable' }}
          path: ${{ env.APP }}-${{ env.VERSION }}.apk
          if-no-files-found: error
      - name: Publish APK and update channel manifest
        env:
          GH_TOKEN: ${{ secrets.ANDROID_DISTRIBUTION_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/publish-distribution.sh
