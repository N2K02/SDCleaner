name: Build SDCleaner APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      version:
        description: "Stable version, e.g. 1.1; blank increments the latest stable version."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP: SDCleaner

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Resolve version and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ github.event.inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          public_last=$(bash .github/scripts/latest-public-version.sh sdcleaner)
          local_last=$(git tag -l 'sdcleaner-v[0-9]*' | sed -nE 's/^sdcleaner-v([0-9]+\.[0-9])$/\1/p' | sort -V | tail -1 || true)
          latest=$(printf '%s\n%s\n' "$local_last" "$public_last" | sed '/^$/d' | sort -V | tail -1)
          if [[ -n "$REQUESTED" ]]; then
            [[ "$REQUESTED" =~ ^[0-9]+\.[0-9]$ ]] || { echo "::error::Version must look like 1.0"; exit 1; }
            version="$REQUESTED"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            version="${latest:-1.0}"
          elif [[ -z "$latest" ]]; then
            version="1.0"
          else
            number=$(( ${latest%.*} * 10 + ${latest#*.} + 1 ))
            version="$((number / 10)).$((number % 10))"
          fi
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && -n "$latest" ]]; then
            [[ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)" == "$version" && "$version" != "$latest" ]] || { echo "::error::Stable version must advance past $latest"; exit 1; }
          fi
          code=$((100000 + GITHUB_RUN_NUMBER))
          suffix=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then suffix="-experimental.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VERSION_SUFFIX=$suffix" >> "$GITHUB_ENV"
          {
            echo "## SDCleaner $version$suffix"
            echo
            echo "### Changes"
            git log -20 --no-merges --pretty='- %s'
            echo
            echo "### Install"
            echo "Install the signed APK from the update release."
          } > release-notes.md
      - name: Validate tests and Android lint
        env:
          N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testFossDebugUnitTest lintFossDebug || {
            find app/build -name 'lint-results-*.txt' -exec cat {} +
            exit 1
          }
      - name: Build and sign APK
        env:
          N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          variant=Release
          [[ "$GITHUB_EVENT_NAME" != "pull_request" ]] || variant=Debug
          ./gradlew --no-daemon "assembleFoss$variant" -PappVersion="$VERSION" -PappVersionCode="$VERSION_CODE" -PappVersionSuffix="$VERSION_SUFFIX"
          APK=$(find "app/build/outputs/apk/foss/${variant,,}" -name '*.apk' -type f | head -1)
          test -n "$APK"
          : "${SIGNING_PASSPHRASE:?SIGNING_PASSPHRASE required}"
          K="$RUNNER_TEMP/sdcleaner-signing"
          umask 077
          mkdir -p "$K"
          trap 'rm -rf "$K"' EXIT
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/keys.tar.enc -pass env:SIGNING_PASSPHRASE | tar -xf - -C "$K"
          export RELEASE_PASSWORD=$(cat "$K/release.pass")
          echo "::add-mask::$RELEASE_PASSWORD"
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$K/release.p12" --ks-pass env:RELEASE_PASSWORD --ks-key-alias release --key-pass env:RELEASE_PASSWORD --out "$APP-$VERSION.apk" "$APK"
          "$BT/apksigner" verify --print-certs "$APP-$VERSION.apk" | grep -E 'Signer.*(DN|SHA-256 digest)'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-${{ env.VERSION }}-${{ github.event_name == 'pull_request' && 'experimental' || 'stable' }}
          path: ${{ env.APP }}-${{ env.VERSION }}.apk
          if-no-files-found: error
      - name: Publish source repository release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            tag="experimental-pr-$PR_NUMBER-run-$GITHUB_RUN_NUMBER"
            target="$PR_HEAD_SHA"
            extra=(--prerelease --latest=false)
          else
            tag="sdcleaner-v$VERSION"
            target="$GITHUB_SHA"
            extra=(--latest)
          fi
          gh release create "$tag" "$APP-$VERSION.apk" --repo "$GITHUB_REPOSITORY" --target "$target" --title "$APP $VERSION$VERSION_SUFFIX" --notes-file release-notes.md "${extra[@]}"
      - name: Check public distribution configuration
        id: distribution
        env:
          DIST_TOKEN: ${{ secrets.ANDROID_DISTRIBUTION_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$DIST_TOKEN" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Signed APK is preserved in Releases and workflow artifacts. Configure ANDROID_DISTRIBUTION_TOKEN to publish the updater feed.'
          fi
      - name: Publish APK and update channel manifest
        if: steps.distribution.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.ANDROID_DISTRIBUTION_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/publish-distribution.sh
      - name: Remove decrypted signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/sdcleaner-signing"
      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/intermediates/lint_intermediate_text_report/
          if-no-files-found: ignore
