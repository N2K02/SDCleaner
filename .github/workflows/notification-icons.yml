name: Notification icon regression
on:
  pull_request:
  push:
    branches: [main, experimental, 'experimental/**']
permissions:
  contents: read
jobs:
  notification-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python -m unittest discover -s tests -p test_notification_icons.py -v
